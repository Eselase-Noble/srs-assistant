[project]
name = "srs-spike"
version = "0.1.0"
description = "Technical spike: local ASR (English/Twi), diarization, translation and requirement extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "transformers>=4.46",
    "torch>=2.5",
    "torchaudio>=2.5",
    "sentencepiece>=0.2",
    "soundfile>=0.12",
    "numpy>=1.26",
    "psutil>=6.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "huggingface-hub>=0.26",
    "soundcard>=0.4.6",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Needs a free Hugging Face account + accepting the model terms (gated model)
diarize = ["pyannote.audio>=4.0"]

[tool.uv]
package = false
